<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stylish QR Code Generator</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ffe066;
      --secondary: #fff;
      --accent: #ffe066;
      --bg: #111;
      --text: #fff;
      --radius: 32px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      margin-top: 2rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0;
      color: var(--accent);
    }
    .container {
      background: #181818;
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      max-width: 400px;
      width: 100%;
      margin-bottom: 2rem;
      color: var(--text);
    }
    label, .preview-label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
      color: var(--secondary);
    }
    input[type="url"] {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #333;
      border-radius: var(--radius);
      font-size: 1rem;
      margin-bottom: 1rem;
      box-sizing: border-box;
      background: #222;
      color: var(--text);
      transition: border 0.2s;
    }
    input[type="url"]:focus {
      border: 1.5px solid var(--primary);
      outline: none;
    }
    .designs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .design-btn {
      flex: 1 1 30%;
      padding: 0.5rem 0.2rem;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #111;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
      margin-top: 0.2rem;
      box-shadow: 0 2px 8px rgba(255,224,102,0.08);
    }
    .design-btn.selected, .design-btn:hover {
      background: #fff;
      color: #111;
      border: 2px solid var(--accent);
    }
    #qrcode-preview {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      min-width: 220px;
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
      border-radius: 32px;
      margin-bottom: 1rem;
      border: 3px solid #ffe066;
      box-shadow: 0 8px 32px rgba(255, 224, 102, 0.18), 0 2px 8px rgba(0,0,0,0.18);
      position: relative;
      transition: box-shadow 0.3s;
      overflow: hidden;
    }
    .qr-frame {
      background: #fff;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(255, 224, 102, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      min-height: 160px;
      position: relative;
      z-index: 2;
      margin-bottom: 0.5em;
      animation: popIn 0.5s cubic-bezier(.68,-0.55,.27,1.55);
    }
    .cta-text {
      background: #ffe066;
      color: #111;
      font-weight: 700;
      padding: 0.3em 1em;
      border-radius: 999px;
      font-size: 1rem;
      box-shadow: 0 2px 8px rgba(255,224,102,0.08);
      z-index: 3;
      letter-spacing: 0.03em;
      pointer-events: none;
      margin-bottom: 0.5em;
      animation: fadeIn 0.7s;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8);}
      100% { opacity: 1; transform: scale(1);}
    }
    @keyframes fadeIn {
      0% { opacity: 0;}
      100% { opacity: 1;}
    }
    .placeholder {
      color: #ffe066cc;
      font-size: 1.1rem;
      text-align: center;
      position: absolute;
      left: 0; right: 0; top: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      animation: fadeIn 0.7s;
    }
    .placeholder svg {
      margin-bottom: 0.5em;
    }
    button#download {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      display: block;
      box-shadow: 0 2px 8px rgba(255,224,102,0.08);
    }
    button#download:disabled {
      background: #333;
      color: #aaa;
      cursor: not-allowed;
    }
    button#download:hover:not(:disabled) {
      background: #fff;
      color: #111;
      border: 2px solid var(--accent);
    }
    @media (max-width: 500px) {
      .container {
        padding: 1rem 0.5rem 1rem 0.5rem;
        max-width: 98vw;
      }
      h1 {
        font-size: 1.3rem;
      }
      #qrcode-preview {
        min-width: 120px;
        min-height: 120px;
        border-radius: 20px;
        padding: 0.5rem;
      }
      .qr-frame {
        min-width: 90px;
        min-height: 90px;
        padding: 8px;
        border-radius: 12px;
      }
      .cta-text {
        font-size: 0.85rem;
        padding: 0.2em 0.7em;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Stylish QR Code Generator</h1>
    <p style="color:#ffe066cc; font-size:1rem;">Create beautiful QR codes for your links</p>
  </header>
  <div class="container">
    <form id="qrForm" autocomplete="off" onsubmit="return false;">
      <label for="link">Paste your link:</label>
      <input type="url" id="link" placeholder="https://example.com" required>
      <label>Choose a design:</label>
      <div class="designs">
        <button type="button" class="design-btn selected" data-design="classic">Classic</button>
        <button type="button" class="design-btn" data-design="rounded">Rounded</button>
        <button type="button" class="design-btn" data-design="colorful">Colorful</button>
        <button type="button" class="design-btn" data-design="shadow">Shadow</button>
        <button type="button" class="design-btn" data-design="soft">Soft</button>
        <button type="button" class="design-btn" data-design="3d">3D</button>
        <button type="button" class="design-btn" data-design="neon">Neon</button>
        <button type="button" class="design-btn" data-design="frame">Frame</button>
      </div>
      <span class="preview-label">Preview:</span>
      <div id="qrcode-preview">
        <span class="placeholder">
          <svg width="48" height="48" fill="none" stroke="#ffe066" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="2"/>
            <rect x="14" y="3" width="7" height="7" rx="2"/>
            <rect x="14" y="14" width="7" height="7" rx="2"/>
            <rect x="3" y="14" width="7" height="7" rx="2"/>
          </svg>
          <span>Your QR code will appear here</span>
        </span>
      </div>
      <button id="download" type="button" disabled>Download QR Code</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    // Design styles
    const designStyles = {
      classic: {
        colorDark: "#fff",
        colorLight: "#111",
        style: ""
      },
      rounded: {
        colorDark: "#ffe066",
        colorLight: "#222",
        style: "border-radius: 24px;"
      },
      colorful: {
        colorDark: "#ffb347",
        colorLight: "#6ee7b7",
        style: "border: 3px solid #ffe066; border-radius: 12px;"
      },
      shadow: {
        colorDark: "#fff",
        colorLight: "#111",
        style: "box-shadow: 0 8px 24px rgba(255,224,102,0.18); border-radius: 16px;"
      },
      soft: {
        colorDark: "#6ee7b7",
        colorLight: "#111",
        style: "border-radius: 50%; border: 2px solid #ffe066;"
      },
      "3d": {
        colorDark: "#ffe066",
        colorLight: "#222",
        style: "box-shadow: 0 4px 20px #ffe06699; border-radius: 20px;"
      },
      neon: {
        colorDark: "#fff200",
        colorLight: "#111",
        style: "box-shadow: 0 0 12px #fff200, 0 0 24px #fff200; border-radius: 16px;"
      },
      frame: {
        colorDark: "#fff",
        colorLight: "#111",
        style: "border: 4px solid #ffe066; border-radius: 8px;"
      }
    };

    // Elements
    const linkInput = document.getElementById('link');
    const designBtns = document.querySelectorAll('.design-btn');
    const qrcodeDiv = document.getElementById('qrcode-preview');
    const downloadBtn = document.getElementById('download');
    let selectedDesign = 'classic';

    // Helper: Remove all children from qrcodeDiv
    function clearQRCode() {
      while (qrcodeDiv.firstChild) {
        qrcodeDiv.removeChild(qrcodeDiv.firstChild);
      }
    }

    // Helper: Generate QR code
    function generateQR(link, design) {
      clearQRCode();
      if (!link) {
        const placeholder = document.createElement('span');
        placeholder.className = 'placeholder';
        placeholder.innerHTML = `
          <svg width="48" height="48" fill="none" stroke="#ffe066" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="2"/>
            <rect x="14" y="3" width="7" height="7" rx="2"/>
            <rect x="14" y="14" width="7" height="7" rx="2"/>
            <rect x="3" y="14" width="7" height="7" rx="2"/>
          </svg>
          <span>Your QR code will appear here</span>
        `;
        qrcodeDiv.appendChild(placeholder);
        downloadBtn.disabled = true;
        return;
      }
      // Create a frame for the QR code
      const frame = document.createElement('div');
      frame.className = 'qr-frame';
      qrcodeDiv.appendChild(frame);

      // Create a temporary div for QRCode.js to use
      const tempDiv = document.createElement('div');
      frame.appendChild(tempDiv);
      const opts = {
        text: link,
        width: 180,
        height: 180,
        colorDark: designStyles[design].colorDark,
        colorLight: designStyles[design].colorLight,
        correctLevel: QRCode.CorrectLevel.H
      };
      new QRCode(tempDiv, opts);

      // Move the canvas/image out of tempDiv and apply style
      setTimeout(() => {
        let qrEl = tempDiv.querySelector('canvas') || tempDiv.querySelector('img');
        if (qrEl) {
          qrEl.style = designStyles[design].style;
          frame.appendChild(qrEl);
          tempDiv.remove();
          downloadBtn.disabled = false;
        }
      }, 100);

      // Add CTA
      const cta = document.createElement('span');
      cta.className = 'cta-text';
      cta.textContent = 'Scan Me!';
      qrcodeDiv.appendChild(cta);
    }

    // Helper: Download QR code
    function downloadQR() {
      const qrEl = qrcodeDiv.querySelector('.qr-frame canvas');
      if (qrEl) {
        const url = qrEl.toDataURL("image/png");
        const a = document.createElement('a');
        a.href = url;
        a.download = "qrcode.png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    // Design button selection
    designBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        designBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedDesign = btn.getAttribute('data-design');
        generateQR(linkInput.value.trim(), selectedDesign);
      });
    });

    // Live preview on input
    linkInput.addEventListener('input', () => {
      generateQR(linkInput.value.trim(), selectedDesign);
    });

    // Download button
    downloadBtn.addEventListener('click', () => {
      if (!downloadBtn.disabled) downloadQR();
    });

    // Initial state
    generateQR("", selectedDesign);
  </script>
</body>
</html>
