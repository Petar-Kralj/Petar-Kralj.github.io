<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Waitlist</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Oswald', oswald; /* Clean and modern font */
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #10382A, #3D4D55, #A79E9C);
            color: #D3C3B9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: #161616;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        
        /* Header Styles */
        h1 {
            font-size: 2.2em;
            color: #B58863;
            margin-bottom: 10px;
        }
        p {
            font-size: 1em;
            color: #D3C3B9;
            margin-bottom: 20px;
        }
        
        /* Form Styles */
        form {
            margin-top: 20px;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #A79E9C;
            border-radius: 8px;
            background-color: #3D4D55;
            color: #D3C3B9;
            font-size: 1em;
        }
        input[type="email"]::placeholder {
            color: #A79E9C;
        }
        button {
            padding: 12px 25px;
            background-color: #B58863;
            color: #161616;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background-color: #A79E9C;
            transform: translateY(-2px);
        }
    </style>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Join Our Waitlist</h1>
        <p>Be the first to know when we launch. Enter your email below:</p>
        <form action="https://formspree.io/f/xqaagonb" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit">Subscribe</button>
        </form>
    </div>
</body>
</html>
